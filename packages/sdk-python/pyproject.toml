[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeverify-sdk"
version = "0.1.0"
description = "CodeVerify SDK — embed formal verification checks programmatically"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "CodeVerify", email = "sdk@codeverify.dev" }
]
keywords = ["codeverify", "verification", "formal-methods", "sdk", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.5",
]

[project.optional-dependencies]
pytest = ["pytest>=8.0"]

[project.entry-points.pytest11]
codeverify = "codeverify_sdk.pytest_plugin"

[project.urls]
Homepage = "https://codeverify.dev"
Documentation = "https://docs.codeverify.dev/sdk/python"
Repository = "https://github.com/codeverify/codeverify"

[tool.hatch.build.targets.wheel]
packages = ["src/codeverify_sdk"]
