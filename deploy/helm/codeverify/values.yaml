# CodeVerify Enterprise Helm Values
# Override these for your environment

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# -- Deployment mode: "cloud" or "airgapped"
deploymentMode: cloud

replicaCount:
  api: 2
  worker: 3
  web: 2
  githubApp: 1

image:
  api:
    repository: codeverify/api
    tag: "0.5.0"
    pullPolicy: IfNotPresent
  worker:
    repository: codeverify/worker
    tag: "0.5.0"
    pullPolicy: IfNotPresent
  web:
    repository: codeverify/web
    tag: "0.5.0"
    pullPolicy: IfNotPresent
  githubApp:
    repository: codeverify/github-app
    tag: "0.5.0"
    pullPolicy: IfNotPresent

# -- API service configuration
api:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8000
  env:
    ENVIRONMENT: production
    LOG_LEVEL: info

# -- Worker configuration
worker:
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  concurrency: 4
  env:
    Z3_TIMEOUT_SECONDS: "60"
    MAX_CONCURRENT_VERIFICATIONS: "4"

# -- Web dashboard configuration
web:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 3000

# -- GitHub App webhook handler
githubApp:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 3001

# -- PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: ""  # Set via --set or secrets
    database: codeverify
  primary:
    persistence:
      enabled: true
      size: 20Gi

# -- Redis configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: codeverify.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /webhooks
          pathType: Prefix
          service: github-app
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: codeverify-tls
      hosts:
        - codeverify.example.com

# -- LLM configuration
llm:
  # Cloud LLM providers
  openai:
    enabled: true
    apiKey: ""  # Set via --set or secrets
    model: gpt-4
  anthropic:
    enabled: true
    apiKey: ""
    model: claude-3-sonnet

  # Local LLM (for air-gapped deployments)
  local:
    enabled: false
    provider: ollama  # ollama or vllm
    model: codellama:13b-instruct
    resources:
      requests:
        cpu: 4000m
        memory: 8Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: 8000m
        memory: 16Gi
        nvidia.com/gpu: "1"

# -- GitHub App credentials
github:
  appId: ""
  privateKey: ""
  webhookSecret: ""

# -- Authentication
auth:
  jwtSecret: ""
  saml:
    enabled: false
    entityId: ""
    ssoUrl: ""
    certificate: ""

# -- Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor: true
  grafana:
    enabled: false

# -- Persistence for proof artifacts
persistence:
  proofStorage:
    enabled: true
    size: 10Gi
    storageClass: ""

# -- Pod security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Node selection
nodeSelector: {}
tolerations: []
affinity: {}
